# Attest release-truth gate for pull requests (PRODUCT_PLAN §9 weeks 7–8).
# Uses the reusable action in .github/actions/attest: local engine, SARIF to
# GitHub code scanning, release delta + blocking contradictions in the step
# summary, Passport/Capsule as artifacts, exit 2 to block on confirmed
# contradictions. No PR comments; no credentials, screenshots, or declaration
# contents are published outside the workflow artifacts.
#
# NOTE: `uses: ./.github/actions/attest` only works in a workspace whose root
# is the Attest source tree (the action builds from source at
# github.action_path/../../..). An external app repo must vendor the full
# Attest source (e.g. clone to attest-vendor/) and use
# `./attest-vendor/.github/actions/attest` instead — copying just the action
# directory fails clearly at the resolve step. See
# docs/DESIGN_PARTNER_PILOT.md §4. The Action has not been observed passing on
# GitHub-hosted runners; only scripts/smoke-action.sh (local) has passed.

name: attest

on:
  pull_request:
    paths:
      - 'app/**'
      - 'declarations/**'

permissions:
  contents: read
  security-events: write

jobs:
  release-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release candidate (your existing Gradle step)
        run: ./gradlew :app:assembleRelease

      - name: Attest release-truth gate
        uses: ./.github/actions/attest
        with:
          base: declarations/last-shipped.apk
          candidate: app/build/outputs/apk/release/app-release.apk
          data-safety: declarations/data-safety.json
          privacy-policy: declarations/privacy-policy.txt
          listing: declarations/store-listing.txt
          # Optional Reviewer Twin evidence — include recorded journeys in the gate:
          # journey: journeys/reviewer-premium-ai-1.3.0.json
          # baseline-journey: journeys/reviewer-premium-ai-1.2.0.json
          # candidate-journey: journeys/reviewer-premium-ai-1.3.0.json
