# Attest release-truth gate for pull requests (PRODUCT_PLAN §9 weeks 7–8).
# Runs the local engine in CI, uploads SARIF to GitHub code scanning, and
# fails the check when confirmed contradictions exist between the release
# candidate and its declarations.

name: attest

on:
  pull_request:
    paths:
      - 'app/**'
      - 'declarations/**'

permissions:
  security-events: write

jobs:
  release-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Attest
        run: |
          npm ci
          npm run build

      - name: Build release candidate (your existing Gradle step)
        run: ./gradlew :app:assembleRelease

      - name: Attest check
        id: attest
        run: |
          node packages/cli/dist/src/cli.js check \
            --base "declarations/last-shipped.apk" \
            --candidate "app/build/outputs/apk/release/app-release.apk" \
            --data-safety declarations/data-safety.json \
            --privacy-policy declarations/privacy-policy.txt \
            --listing declarations/store-listing.txt \
            --format sarif --out attest-results.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: attest-results.sarif

      - name: Gate
        if: steps.attest.outcome == 'failure'
        run: |
          echo "::error::Attest found confirmed contradictions between the build and its declarations."
          exit 2
